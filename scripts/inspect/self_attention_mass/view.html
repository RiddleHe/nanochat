<div id="target-self-attention" style="color-scheme:only dark;--background:Canvas;--foreground:CanvasText;--popover:Canvas;--popover-foreground:CanvasText;--border:color-mix(in srgb,CanvasText 18%,Canvas);background:var(--background);color:var(--foreground);position:relative">
<style>
#target-self-attention h3{padding-right:90px}
#target-self-attention .chart{display:block;width:100%}
#target-self-attention .chart text{fill:var(--foreground);font-size:12px}
#target-self-attention .legend{display:flex;flex-wrap:wrap;gap:20px;margin:12px 0}
#target-self-attention .legend button{display:inline-flex;gap:7px;align-items:center;background:transparent;border:0;padding:0;color:var(--foreground);font:inherit}
#target-self-attention .legend button[aria-pressed="false"]{opacity:.4}
#target-self-attention .dot-swatch{height:7px;width:7px;border-radius:50%;background:var(--viz-series-1)}
#target-self-attention .line-swatch{width:22px;border-top:2px solid var(--foreground)}
#target-self-attention .tooltip{position:absolute;pointer-events:none;background:var(--popover);color:var(--popover-foreground);padding:10px;max-width:100%;box-sizing:border-box;z-index:2}
#target-self-attention .tooltip div+div{margin-top:4px}
@media(pointer:coarse){#target-self-attention .legend button{min-height:44px}}
</style>
<h3>Attention to current token</h3>
<div class="legend text-small">
<button type="button" class="cursor-interaction" data-series="heads" aria-pressed="true"><span class="dot-swatch"></span>Heads</button>
<button type="button" class="cursor-interaction" data-series="mean" aria-pressed="true"><span class="line-swatch"></span>Mean of heads</button>
</div>
<svg class="chart" role="img" aria-label="Mean self-attention probability for each head at eleven target layers, with a curve connecting each layer's average across heads."></svg>
<div class="tooltip text-small tabular-nums" role="tooltip" hidden></div>
<script type="application/json">__DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
const root=document.getElementById('target-self-attention'),data=JSON.parse(root.querySelector('script[type="application/json"]').textContent),svg=d3.select(root.querySelector('.chart')),tip=root.querySelector('.tooltip');
const points=data.rows.flatMap(r=>r.heads.map(h=>({...h,layer:r.layer,layerMean:r.mean,x:r.layer+(h.head-5.5)*.035}))),means=data.rows.map(r=>({layer:r.layer,x:r.layer,mean:r.mean}));
let visible=new Set(['heads','mean']),pinned=null;
function restore(state){const s=state?.modelContent;if(s?.view!=='target-self-attention'||s.run_id!==data.run_id)return;if(Array.isArray(s.visible))visible=new Set(s.visible.filter(x=>['heads','mean'].includes(x)));pinned=s.selected&&points.some(p=>p.layer===s.selected.layer&&p.head===s.selected.head)?s.selected:null;}
function save(){window.openai?.setWidgetState?.({modelContent:{view:'target-self-attention',run_id:data.run_id,visible:[...visible],selected:pinned},privateContent:null})?.catch(()=>{});}
restore(window.openai?.widgetState);
function draw(){
const w=root.clientWidth,h=w<440?360:440,f={left:64,right:w-14,top:12,bottom:h-58},extent=d3.extent(points,p=>p.layer),x=d3.scaleLinear().domain([extent[0]-.55,extent[1]+.55]).range([f.left+5,f.right-5]),y=d3.scaleLinear().domain(d3.extent([0,1,...points.map(p=>p.mean)])).range([f.bottom-5,f.top+5]);
svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);svg.append('title').text('Attention to current token · target layers');svg.append('desc').text('GPTBaseScalarResQKVNoEmbedNorm checkpoint 7773. Each dot is one head averaged over 262,016 token occurrences in 128 validation sequences, excluding the first position of each sequence. White line equally averages twelve heads. Horizontal offsets separate heads; all head dots belong to their integer layer. Token population SD and count are available on hover.');
svg.append('rect').attr('data-chart-frame','').attr('x',f.left).attr('y',f.top).attr('width',f.right-f.left).attr('height',f.bottom-f.top).attr('fill','none').attr('stroke','var(--border)');
for(const v of [0,.25,.5,.75,1])svg.append('line').attr('x1',f.left).attr('x2',f.right).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','var(--border)');
svg.append('g').attr('class','axis').attr('transform',`translate(${f.left},0)`).call(d3.axisLeft(y).tickValues([0,.25,.5,.75,1]).tickFormat(d3.format('.0%')).tickSize(0).tickPadding(8));
const ticks=w<440?[9,14,18,23]:data.rows.map(r=>r.layer);svg.append('g').attr('class','axis').attr('transform',`translate(0,${f.bottom})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSize(0).tickPadding(10));svg.selectAll('.axis .domain').remove();
svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(f.left+f.right)/2).attr('y',h-10).attr('text-anchor','middle').text('Target layer index');
svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(18,${(f.top+f.bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('Mean self-attention probability');
for(const name of ['heads','mean'])root.querySelector(`button[data-series="${name}"]`).setAttribute('aria-pressed',visible.has(name));
const dots=svg.append('g').attr('data-series-group','heads').attr('display',visible.has('heads')?null:'none');dots.selectAll('circle').data(points).join('circle').attr('data-head-dot',p=>`${p.layer}:${p.head}`).attr('cx',p=>x(p.x)).attr('cy',p=>y(p.mean)).attr('r',3.5).attr('fill','var(--viz-series-1)').attr('fill-opacity',.8);
const line=svg.append('g').attr('data-series-group','mean').attr('display',visible.has('mean')?null:'none');line.append('path').datum(means).attr('data-mean-curve','').attr('d',d3.line().x(p=>x(p.x)).y(p=>y(p.mean))).attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',2);line.selectAll('rect').data(means).join('rect').attr('x',p=>x(p.x)-3).attr('y',p=>y(p.mean)-3).attr('width',6).attr('height',6).attr('fill','var(--foreground)');
const focus=svg.append('circle').attr('data-hover-highlight','').attr('r',6).attr('fill','none').attr('stroke','var(--foreground)').attr('visibility','hidden');
function clear(){tip.hidden=true;focus.attr('visibility','hidden');}
function show(p){if(!p){clear();return;}focus.attr('cx',x(p.x)).attr('cy',y(p.mean)).attr('visibility','visible');tip.replaceChildren();const rows=[p.head===undefined?`L${p.layer} · mean of heads`:`L${p.layer} · H${p.head}`,`Self-attention: ${(p.mean*100).toFixed(2)}%`];if(p.head!==undefined)rows.push(`Token SD: ${(p.std*100).toFixed(2)} percentage points`,`${p.count.toLocaleString()} token occurrences`,`Layer mean: ${(p.layerMean*100).toFixed(2)}%`);for(const text of rows){const el=document.createElement('div');el.textContent=text;tip.append(el);}tip.hidden=false;tip.style.left=Math.max(0,Math.min(w-tip.offsetWidth,x(p.x)+12))+'px';tip.style.top=(svg.node().getBoundingClientRect().top-root.getBoundingClientRect().top+f.top+8)+'px';}
function nearest(e){const [px,py]=d3.pointer(e,svg.node());const candidates=visible.has('heads')?points:visible.has('mean')?means:[];return d3.least(candidates,p=>(x(p.x)-px)**2+(y(p.mean)-py)**2);}
svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','nearest-point').attr('x',f.left).attr('y',f.top).attr('width',f.right-f.left).attr('height',f.bottom-f.top).attr('fill','transparent').on('pointermove',e=>{if(!pinned)show(nearest(e));}).on('pointerleave',()=>{if(!pinned)clear();}).on('click',e=>{const p=nearest(e);pinned=pinned?null:p?{layer:p.layer,head:p.head}:null;show(pinned?p:null);save();});
if(pinned&&visible.has('heads'))show(points.find(p=>p.layer===pinned.layer&&p.head===pinned.head));else clear();
const labels=[...svg.node().querySelectorAll('text')];let overlap=false;labels.forEach((a,i)=>labels.slice(i+1).forEach(b=>{const r=a.getBoundingClientRect(),s=b.getBoundingClientRect();if(r.left<s.right+4&&r.right+4>s.left&&r.top<s.bottom+4&&r.bottom+4>s.top)overlap=true;}));svg.attr('data-label-overlap',String(overlap));
}
root.querySelectorAll('button[data-series]').forEach(b=>b.addEventListener('click',()=>{visible.has(b.dataset.series)?visible.delete(b.dataset.series):visible.add(b.dataset.series);pinned=null;draw();save();}));window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);draw();});new ResizeObserver(draw).observe(root);draw();
})();
</script>
</div>
