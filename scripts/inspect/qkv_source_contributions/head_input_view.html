<div id="gpt-base-head-input">
  <style>
    #gpt-base-head-input {position:relative;color-scheme:only dark;--background:#181818;--foreground:#f4f4f4;--muted-foreground:#b8b8b8;--border:#353535;--popover:#242424;--popover-foreground:#f4f4f4;--viz-series-1:#5a9aef;background:var(--background);color:var(--foreground);padding:12px;box-sizing:border-box}
    #gpt-base-head-input .norm-panels {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
    #gpt-base-head-input figure {margin:0;min-width:0}
    #gpt-base-head-input .norm-chart {display:block;width:100%}
    #gpt-base-head-input .norm-chart text {fill:var(--foreground);font-size:12px;font-weight:400}
    #gpt-base-head-input .norm-legend {display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
    #gpt-base-head-input .norm-legend button {background:transparent!important;border:0;padding:0;color:var(--foreground)!important;font:inherit;display:inline-flex;align-items:center;gap:6px}
    #gpt-base-head-input .norm-legend button[aria-pressed="false"] {opacity:.45}
    #gpt-base-head-input .norm-tooltip {position:absolute;pointer-events:none;z-index:10;background:var(--popover);color:var(--popover-foreground);padding:8px;max-width:280px}
    #gpt-base-head-input .norm-tooltip table {border-collapse:collapse}
    #gpt-base-head-input .norm-tooltip td {padding:2px 6px}
    #gpt-base-head-input .norm-tooltip td:not(:first-child) {text-align:right}
    #gpt-base-head-input #norm-raw {margin-top:24px}
    #gpt-base-head-input #norm-detail {min-height:24px;margin-top:8px}
    @media(max-width:780px){#gpt-base-head-input .norm-panels {grid-template-columns:1fr}}
  </style>
  <h2>Source magnitude before and after Q/K/V projection</h2>
  <div id="norm-caption" class="text-small"></div>
  <div id="norm-legend" class="norm-legend text-small" aria-label="Visible series"></div>
  <div id="norm-panels" class="norm-panels"></div>
  <div id="norm-detail" class="text-small tabular-nums" aria-live="polite"></div>
  <div id="norm-raw"></div>
  <div id="norm-tooltip" class="norm-tooltip tooltip text-small tabular-nums" role="tooltip" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('gpt-base-head-input'),data=__SOURCE_NORMS_DATA__;
    const get=id=>root.querySelector('#'+id),names=['Input','Projected'];
    const sourceStart=data.x_start??-1;
    const labels={Input:`Input · ${data.input_dimensions.toLocaleString()}D`,Projected:`Head output · ${data.output_dimensions}D`};
    const colors={Input:'var(--foreground)',Projected:'var(--viz-series-1)'};
    const dash={Input:'6 3',Projected:null};
    const fmt=d3.format('.3f');
    let enabled=new Set(names),pinned=null;
    function restore(state){
      if(state?.modelContent?.run_id!==data.run_id||state.modelContent.view!==data.view)return;
      enabled=new Set((state.privateContent?.enabled||names).filter(n=>names.includes(n)));
      pinned=state.modelContent.selection||null;
    }
    restore(window.openai?.widgetState);
    if(data.title)root.querySelector('h2').textContent=data.title;
    if(data.columns===1)get('norm-panels').style.gridTemplateColumns='1fr';
    get('norm-caption').textContent=`${data.family_label||'Emb + attention'} sources · ${data.tokens.toLocaleString()} tokens · zero-based layers and heads · no rescaling · identical Y scale in all panels · before RoPE and Q/K normalization`;
    if(data.source_caption)get('norm-caption').textContent+=' · '+data.source_caption;
    const buttons=[];
    names.forEach(name=>{
      const button=document.createElement('button');button.type='button';button.className='cursor-interaction';
      button.setAttribute('aria-pressed',String(enabled.has(name)));button.setAttribute('aria-label',labels[name]);
      const swatch=d3.select(button).append('svg').attr('width',24).attr('height',12).attr('aria-hidden','true');
      swatch.append('line').attr('x1',1).attr('x2',23).attr('y1',6).attr('y2',6).attr('stroke',colors[name]).attr('stroke-width',2).attr('stroke-dasharray',dash[name]);
      button.appendChild(document.createTextNode(labels[name]));get('norm-legend').appendChild(button);
      buttons.push({button,name});button.addEventListener('click',()=>{
        enabled.has(name)?enabled.delete(name):enabled.add(name);redraw();save();
      });
    });
    if(!data.raw)get('norm-raw').hidden=true;
    const panels=[...data.panels,...(data.raw?[data.raw]:[])].map(panel=>{
      const figure=document.createElement('figure'),title=document.createElement('h3'),holder=document.createElement('div');
      title.textContent=panel.title;
      figure.append(title,holder);
      get(panel.layer===null?'norm-raw':'norm-panels').appendChild(figure);
      return {...panel,id:`${panel.layer}-${panel.head}-${panel.kind}`,holder};
    });
    function save(){window.openai?.setWidgetState({modelContent:{run_id:data.run_id,view:data.view,selection:pinned},privateContent:{enabled:[...enabled]}}).catch(()=>{});}
    function visible(panel){return panel.series.filter(s=>panel.layer===null||enabled.has(s.name));}
    function sample(series,x){
      const lo=Math.floor(x-sourceStart),hi=Math.min(series.values.length-1,lo+1),t=x-sourceStart-lo;
      return {name:series.name,value:series.values[lo]*(1-t)+series.values[hi]*t,std:series.std[lo]*(1-t)+series.std[hi]*t};
    }
    function sourceLabel(x,panel){
      if(panel.source_labels){
        const lo=Math.floor(x-sourceStart),hi=Math.min(panel.source_labels.length-1,lo+1);
        return Math.abs(x-Math.round(x))<.015?panel.source_labels[Math.round(x-sourceStart)]:`${panel.source_labels[lo]} → ${panel.source_labels[hi]} (interpolated)`;
      }
      return Math.abs(x-Math.round(x))<.015?(Math.round(x)===-1?'Emb':String(Math.round(x))):`${x.toFixed(2)} (interpolated)`;
    }
    function draw(panel){
      const width=panel.holder.getBoundingClientRect().width;if(width<1)return;
      panel.holder.replaceChildren();
      const height=244,left=64,right=12,top=12,bottom=48;
      const maxSource=panel.series[0].values.length-1+sourceStart;
      const x=d3.scaleLinear().domain([sourceStart,maxSource]).range([left+4,width-right-4]);
      const maximum=panel.layer===null?data.raw_max:data.comparison_max;
      const y=d3.scaleLinear().domain([0,maximum*1.05]).range([height-bottom-4,top+4]);
      const svg=d3.select(panel.holder).append('svg').attr('class','norm-chart').attr('viewBox',`0 0 ${width} ${height}`).attr('role','img').attr('aria-label',`${panel.title}, mean per-token L2 norm by source layer`);
      svg.append('title').text(panel.title);
      svg.append('desc').text(`Full ${data.input_dimensions}-dimensional input-component norms and ${data.output_dimensions}-dimensional head ${panel.head} ${panel.kind} output norms, averaged over tokens only. No rescaling or head averaging.`);
      svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',width-left-right).attr('height',height-bottom-top).attr('fill','none').attr('stroke','var(--border)');
      const ticks=y.ticks(4);
      svg.append('g').selectAll('line').data(ticks).join('line').attr('x1',left).attr('x2',width-right).attr('y1',y).attr('y2',y).attr('stroke','var(--border)').attr('stroke-opacity',.5);
      svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).tickValues(ticks).tickSize(0).tickPadding(8)).call(g=>g.select('.domain').remove());
      const n=width<360?4:Math.min(7,Math.floor((width-left-right)/40));
      let xticks=[...new Set(d3.range(n).map(i=>Math.round(sourceStart+i*(maxSource-sourceStart)/(n-1))))];
      if(panel.source_labels){
        const pairs=panel.source_labels.length/2;
        const count=width<360?2:Math.min(pairs,Math.max(2,Math.floor((width-left-right)/70)));
        xticks=[...new Set(d3.range(count).map(i=>Math.round(i*(pairs-1)/(count-1))))].flatMap(i=>[2*i,2*i+1]);
      }
      const xaxis=svg.append('g').attr('data-source-axis','').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).tickValues(xticks).tickFormat(v=>panel.source_labels?panel.source_labels[v-sourceStart]:(v===-1?'Emb':v)).tickSize(0).tickPadding(8)).call(g=>g.select('.domain').remove());
      if(panel.source_labels)xaxis.selectAll('text').attr('y',v=>v%2===0?8:26);
      else xaxis.selectAll('text').attr('text-anchor',v=>v===sourceStart?'start':v===maxSource?'end':'middle');
      svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+width-right)/2).attr('y',height-5).attr('text-anchor','middle').text('Source layer index');
      svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(16,${(top+height-bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('Mean L2 norm');
      for(const series of visible(panel)){
        const points=series.values.map((value,i)=>({x:i+sourceStart,value}));
        svg.append('path').datum(points).attr('data-series',series.name).attr('d',d3.line().x(d=>x(d.x)).y(d=>y(d.value)))
          .attr('fill','none').attr('stroke',colors[series.name]).attr('stroke-width',2).attr('stroke-dasharray',dash[series.name]);
        svg.append('g').attr('data-series-points',series.name).selectAll('circle').data(points).join('circle').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.value)).attr('r',2.5).attr('fill',colors[series.name]);
      }
      const guide=svg.append('line').attr('data-chart-hover-guide','').attr('y1',top).attr('y2',height-bottom).attr('stroke','var(--border)').attr('visibility','hidden');
      const markers=svg.append('g');
      function show(value,event){
        guide.attr('x1',x(value)).attr('x2',x(value)).attr('visibility','visible');
        const rows=visible(panel).map(s=>sample(s,value));
        markers.selectAll('circle').data(rows,d=>d.name).join('circle').attr('data-chart-hover-marker','').attr('cx',x(value)).attr('cy',d=>y(d.value)).attr('r',4).attr('fill',d=>colors[d.name]);
        if(event){
          const tip=get('norm-tooltip');tip.replaceChildren();
          const title=document.createElement('div');title.textContent=`${panel.title} · source ${sourceLabel(value,panel)}`;tip.appendChild(title);
          const table=document.createElement('table');
          const header=table.insertRow();['','Mean','Token std'].forEach(t=>{header.insertCell().textContent=t;});
          rows.forEach(row=>{const tr=table.insertRow();[labels[row.name],fmt(row.value),fmt(row.std)].forEach(t=>{tr.insertCell().textContent=t;});});
          tip.appendChild(table);tip.hidden=false;
          const bounds=root.getBoundingClientRect();tip.style.left=Math.max(0,Math.min(event.clientX-bounds.left+12,bounds.width-tip.offsetWidth))+'px';
          tip.style.top=Math.max(0,event.clientY-bounds.top-tip.offsetHeight-10)+'px';
        }
        return rows;
      }
      if(pinned?.panel===panel.id&&pinned.x>=sourceStart&&pinned.x<=maxSource){
        const rows=show(pinned.x);get('norm-detail').textContent=`${panel.title} · source ${sourceLabel(pinned.x,panel)} · ${rows.map(r=>labels[r.name]+' '+fmt(r.value)).join(' · ')}`;
      }
      const overlay=svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('class','cursor-interaction')
        .attr('x',left).attr('y',top).attr('width',width-left-right).attr('height',height-bottom-top).attr('fill','transparent');
      const at=event=>Math.max(sourceStart,Math.min(maxSource,x.invert(d3.pointer(event,svg.node())[0])));
      overlay.on('pointermove',event=>show(at(event),event)).on('pointerleave',()=>{
        get('norm-tooltip').hidden=true;guide.attr('visibility','hidden');markers.selectAll('*').remove();
        if(pinned?.panel===panel.id)show(pinned.x);
      }).on('click',event=>{pinned={panel:panel.id,x:at(event)};redraw();save();});
      // Check all label bounds after layout; drop interior X ticks if needed.
      const xtexts=svg.selectAll('g.tick text').nodes().filter(n=>n.getBoundingClientRect().y>svg.node().getBoundingClientRect().y+height-bottom-2);
      const kept=[];
      for(const node of xtexts){const b=node.getBoundingClientRect();if(kept.some(p=>b.left<p.right+4&&b.right+4>p.left&&b.top<p.bottom+4&&b.bottom+4>p.top)){node.parentNode.remove();}else kept.push(b);}
    }
    function redraw(){get('norm-tooltip').hidden=true;get('norm-detail').textContent='';buttons.forEach(({button,name})=>button.setAttribute('aria-pressed',String(enabled.has(name))));panels.forEach(draw);}
    window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);redraw();});
    const observer=new ResizeObserver(redraw);panels.forEach(p=>observer.observe(p.holder));redraw();
  })();
  </script>
</div>
