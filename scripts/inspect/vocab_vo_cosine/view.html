<div id="vocab-vo-cosine" style="color-scheme:only dark;--background:Canvas;--foreground:CanvasText;--popover:Canvas;--popover-foreground:CanvasText;--border:color-mix(in srgb,CanvasText 18%,Canvas);background:var(--background);color:var(--foreground);position:relative">
<style>
#vocab-vo-cosine .chart{display:block;width:100%}
#vocab-vo-cosine .chart text{fill:var(--foreground);font-size:12px}
#vocab-vo-cosine .legend{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0}
#vocab-vo-cosine .legend button{display:inline-flex;gap:6px;align-items:center;background:transparent;border:0;padding:0;color:var(--foreground);font:inherit}
#vocab-vo-cosine .legend button[aria-pressed="false"]{opacity:.45}
#vocab-vo-cosine .swatch{width:22px;border-top:2px solid var(--viz-series-1)}
#vocab-vo-cosine .swatch.scalar{border-color:var(--viz-series-2);border-top-style:dashed}
#vocab-vo-cosine .tooltip{position:absolute;pointer-events:none;background:var(--popover);color:var(--popover-foreground);padding:10px;max-width:100%;box-sizing:border-box;z-index:2}
#vocab-vo-cosine .row{margin-top:5px}
</style>
<h3>Embedding → V → O · cosine similarity</h3>
<div class="legend text-small"></div>
<svg class="chart" role="img" aria-label="Vocabulary embedding cosine with its V then O transform. Each layer is sorted independently from highest to lowest cosine."></svg>
<div class="tooltip text-small tabular-nums" role="tooltip" hidden></div>
<script type="application/json">__DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
const root=document.getElementById('vocab-vo-cosine'),data=JSON.parse(root.querySelector('script[type="application/json"]').textContent),svg=d3.select(root.querySelector('.chart')),tip=root.querySelector('.tooltip');
const series=data.series.map((s,i)=>({...s,color:`var(--viz-series-${i%6+1})`,dash:i<6?null:'6 3'}));
const legend=root.querySelector('.legend');for(const s of series){const b=document.createElement('button');b.type='button';b.dataset.series=s.id;b.setAttribute('aria-pressed','true');const sw=document.createElement('span');sw.className='swatch';sw.style.borderColor=s.color;if(s.dash)sw.style.borderTopStyle='dashed';b.append(sw,document.createTextNode(s.label));legend.append(b);}
let visible=new Set(series.map(s=>s.id)),pinned=null;
function restore(state){const s=state?.modelContent;if(s?.view!=='vocab-vo-cosine')return;if(Array.isArray(s.visible))visible=new Set(s.visible.filter(id=>series.some(d=>d.id===id)));pinned=Number.isFinite(s.progress)&&s.progress>=0&&s.progress<=100?s.progress:null;}
function save(){window.openai?.setWidgetState?.({modelContent:{view:'vocab-vo-cosine',visible:[...visible],progress:pinned},privateContent:null})?.catch(()=>{});}
restore(window.openai?.widgetState);
function interpolate(points,at){if(at<points[0].x||at>points.at(-1).x)return null;const j=d3.bisector(p=>p.x).left(points,at);if(j===0)return {...points[0],interpolated:false};const a=points[j-1],b=points[j],t=(at-a.x)/(b.x-a.x);return {x:at,y:a.y+t*(b.y-a.y),interpolated:t>1e-8&&t<1-1e-8};}
function draw(){
 const w=root.clientWidth,h=w<440?360:440,f={left:64,right:w-14,top:12,bottom:h-60};
 const extent=d3.extent(series.flatMap(s=>s.points),p=>p.y),pad=(extent[1]-extent[0])*.08;
 const x=d3.scaleLinear().domain([0,100]).range([f.left+4,f.right-4]),y=d3.scaleLinear().domain([-1,1]).range([f.bottom-4,f.top+4]);
 svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);
 svg.append('title').text('Vocabulary V to O cosine: descending rank');svg.append('desc').text('All valid vocabulary rows, equally weighted. Each layer is sorted independently; rank does not align token identity across layers. Full cosine scale minus one to one. Display interpolation error at most 0.0001.');
 svg.append('line').attr('data-zero-reference','').attr('x1',f.left).attr('x2',f.right).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--foreground)').attr('stroke-opacity',.5).attr('stroke-dasharray','4 4');
 svg.append('rect').attr('data-chart-frame','').attr('x',f.left).attr('y',f.top).attr('width',f.right-f.left).attr('height',f.bottom-f.top).attr('fill','none').attr('stroke','var(--border)');
 for(const v of y.ticks(5))svg.append('line').attr('x1',f.left).attr('x2',f.right).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','var(--border)');
 svg.append('g').attr('class','axis').attr('transform',`translate(${f.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format('.1f')).tickSize(0).tickPadding(8));
 svg.append('g').attr('class','axis').attr('transform',`translate(0,${f.bottom})`).call(d3.axisBottom(x).tickValues(w<440?[0,50,100]:[0,20,40,60,80,100]).tickFormat(v=>v+'%').tickSize(0).tickPadding(10));
 svg.selectAll('.axis .domain').remove();svg.selectAll('.axis:last-of-type .tick text').attr('text-anchor',d=>d===0?'start':d===100?'end':'middle');
 svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(f.left+f.right)/2).attr('y',h-12).attr('text-anchor','middle').text(w<440?'Token rank percentile':'Token rank percentile · highest to lowest cosine');
 svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(18,${(f.top+f.bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('Cosine similarity');
 for(const s of series){root.querySelector(`button[data-series="${s.id}"]`).setAttribute('aria-pressed',visible.has(s.id));svg.append('path').datum(s.points).attr('data-line',s.id).attr('display',visible.has(s.id)?null:'none').attr('d',d3.line().x(p=>x(p.x)).y(p=>y(p.y))).attr('fill','none').attr('stroke',s.color).attr('stroke-width',1.4).attr('stroke-dasharray',s.dash);}
 const guide=svg.append('line').attr('data-chart-hover-guide','').attr('y1',f.top).attr('y2',f.bottom).attr('stroke','var(--foreground)').attr('stroke-opacity',.4).attr('visibility','hidden'),marks=svg.append('g');
 function clear(){tip.hidden=true;guide.attr('visibility','hidden');marks.selectAll('*').remove();}
 function show(at){tip.replaceChildren();marks.selectAll('*').remove();guide.attr('x1',x(at)).attr('x2',x(at)).attr('visibility','visible');const title=document.createElement('div');title.textContent=at.toFixed(2)+'% rank · interpolated';tip.append(title);let rows=0;for(const s of series){if(!visible.has(s.id))continue;const p=interpolate(s.points,at);if(!p)continue;rows++;marks.append('circle').attr('data-chart-hover-marker',s.id).attr('cx',x(at)).attr('cy',y(p.y)).attr('r',3).attr('fill',s.color);const row=document.createElement('div');row.className='row';row.dataset.tooltipSeries=s.id;row.textContent=`${s.label}: ${p.y.toFixed(4)}`;tip.append(row);}tip.hidden=!rows;tip.style.left=Math.max(0,Math.min(w-tip.offsetWidth,x(at)-tip.offsetWidth/2))+'px';tip.style.top=(svg.node().getBoundingClientRect().top-root.getBoundingClientRect().top+f.top+8)+'px';}
 const coordinate=e=>Math.max(0,Math.min(100,x.invert(d3.pointer(e,svg.node())[0])));
 svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',f.left).attr('y',f.top).attr('width',f.right-f.left).attr('height',f.bottom-f.top).attr('fill','transparent').on('pointermove',e=>{if(pinned===null)show(coordinate(e));}).on('pointerleave',()=>{if(pinned===null)clear();}).on('click',e=>{pinned=pinned===null?coordinate(e):null;if(pinned===null)clear();else show(pinned);save();});
 if(pinned!==null)show(pinned);else clear();
 const labels=[...svg.node().querySelectorAll('text')];let overlap=false;labels.forEach((a,i)=>labels.slice(i+1).forEach(b=>{const r=a.getBoundingClientRect(),s=b.getBoundingClientRect();if(r.left<s.right+4&&r.right+4>s.left&&r.top<s.bottom+4&&r.bottom+4>s.top)overlap=true;}));svg.attr('data-label-overlap',String(overlap));
}
root.querySelectorAll('button[data-series]').forEach(b=>b.addEventListener('click',()=>{visible.has(b.dataset.series)?visible.delete(b.dataset.series):visible.add(b.dataset.series);draw();save();}));
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);draw();});new ResizeObserver(draw).observe(root);draw();
})();
</script>
</div>
